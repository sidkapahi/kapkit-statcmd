name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          # Public URL of the statcmd Worker's /v3 render route. Drives both the
          # generated command string and the live preview. Not a secret, so a
          # repository variable is the natural home (a secret works too).
          VITE_STATCMD_URL: ${{ vars.VITE_STATCMD_URL || secrets.VITE_STATCMD_URL }}
          # Mixpanel analytics — the project token is a public, write-only
          # identifier, so a repository variable is the natural home. Optional;
          # leave unset to disable analytics entirely. Never put the Mixpanel
          # API Secret here — only the public project token belongs in the build.
          VITE_MIXPANEL_TOKEN: ${{ vars.VITE_MIXPANEL_TOKEN || secrets.VITE_MIXPANEL_TOKEN }}
          VITE_MIXPANEL_HOST: ${{ vars.VITE_MIXPANEL_HOST }}
          VITE_MIXPANEL_SITE: ${{ vars.VITE_MIXPANEL_SITE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
